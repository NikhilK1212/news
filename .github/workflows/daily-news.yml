name: Daily News Digest

on:
  schedule:
    # 12:00 UTC = 7:00 AM EST (standard time). During daylight saving (EDT),
    # this will fire at 8:00 AM instead of 7:00. Adjust to 11 if you want it
    # to stay locked to 7:00 AM EDT during summer months instead.
    - cron: "0 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate digest
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI }}
        run: node scripts/generate-news.mjs

      - name: Commit updated digest
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add docs/index.html
          git diff --quiet --cached || git commit -m "Update daily news digest"
          git push
